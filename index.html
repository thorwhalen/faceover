<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      The privacy promise, enforced by the browser: scripts, models and fetches may come only
      from this origin (blob:/data: for the photo itself). Nothing can be sent elsewhere.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' blob: data:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; form-action 'none'; base-uri 'self'"
    />
    <title>Faceover</title>
    <meta name="description" content="Hide every face in a photo behind an animal. Everything happens on your device." />
    <meta name="theme-color" content="#0a0a0a" />
    <meta property="og:title" content="Faceover" />
    <meta property="og:description" content="Hide every face in a photo behind an animal. Everything happens on your device." />
    <meta property="og:url" content="https://apps.thorwhalen.com/faceover/" />
    <meta property="og:image" content="https://apps.thorwhalen.com/faceover/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="icon-512.png" />
    <link rel="apple-touch-icon" href="icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
